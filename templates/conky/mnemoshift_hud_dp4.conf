-- ==============================================================================
-- MnemoShift Tactical HUD Conky Configuration (Primary DP-4 Ultra-Wide)
-- Theme: Cyber-Blueprint & Tactical Smoked Glass (#0B0E14 / #29F0F7 / #E5A958)
-- ==============================================================================

conky.config = {
    xinerama_head = 0,
    alignment = 'top_right',
    gap_x = 40,
    gap_y = 50,
    minimum_width = 380,
    maximum_width = 400,

    background = true,
    update_interval = 2.0,
    total_run_times = 0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    double_buffer = true,
    no_buffers = true,

    -- Window specifications: SMOKED GLASS PANEL
    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 220, -- ~86% opacity smoked glass
    own_window_colour = '#0B0E14', -- Deep Void black/charcoal
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    -- Border and padding: Laser Cyan frame
    draw_borders = true,
    border_width = 1,
    border_inner_margin = 18,
    border_outer_margin = 0,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,

    -- Typography & UTF-8
    use_xft = true,
    font = 'JetBrains Mono:size=9.5:style=Medium',
    xftalpha = 1.0,
    override_utf8_locale = true,

    -- MnemoShift Color Palette
    default_color = '#29F0F7',     -- Laser Cyan Window Border
    color0 = '#E2E8F0',            -- Technical White / Slate Text
    color1 = '#29F0F7',            -- Laser Cyan (Primary Brand)
    color2 = '#E5A958',            -- Warm Amber (Status / Milestones)
    color3 = '#2A3644',            -- Border / CAD Grid
    color4 = '#94A3B8',            -- Muted Slate Labels
};

conky.text = [[
${color1}+-- [ MNEMOSHIFT TACTICAL HUD // DP-4 ] ------------+${color0}
| ${color4}STATION:${color0} ${color2}MnemoShift-Workstation-1${color0}
| ${color4}UPTIME :${color0} $uptime ${alignr}${color4}LOAD:${color0} $loadavg
+-- [ COMPUTATIONAL MATRIX ] -----------------------+${color0}
| ${color1}CPU :${color0} i5-10400F (${freq_g}GHz) ${alignr}${color2}${cpu cpu0}%${color0}
| ${color3}${cpugraph cpu0 20,360 2A3644 29F0F7 -l}${color0}
| ${color1}RAM :${color0} 64 GB DDR4 ${alignr}${color2}$mem / $memmax ($memperc%)${color0}
| ${color3}${membar 4,360}${color0}
| ${color1}SWAP:${color0} NVMe Storage ${alignr}${color2}$swap / $swapmax ($swapperc%)${color0}
+-- [ ACCELERATION & VRAM ] ------------------------+${color0}
| ${color1}GPU :${color0} RTX 4060 Ti 16GB ${alignr}${color2}${execi 2 nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader 2>/dev/null || echo 0}°C${color0}
| ${color4}VRAM:${color0} ${execi 2 nvidia-smi --query-gpu=memory.used,memory.total --format=csv,noheader,nounits 2>/dev/null | awk '{printf "%.1f / %.1f GiB", $1/1024, $2/1024}' || echo "N/A"}${alignr}${color2}UTIL: ${execi 2 nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader 2>/dev/null || echo "0 %"}${color0}
| ${color4}PWR :${color0} ${execi 2 nvidia-smi --query-gpu=power.draw,power.limit --format=csv,noheader 2>/dev/null || awk '{printf "%.1f / %.0f W", $1, $3}' || echo "N/A"}
+-- [ STORAGE & I/O ] ------------------------------+${color0}
| ${color4}NVMe / :${color0} ${fs_used /} / ${fs_size /} ${alignr}${color2}${fs_used_perc /}%${color0}
| ${color3}${fs_bar 4,360 /}${color0}
| ${color4}I/O R/W:${color0} Read: ${diskio_read} ${alignr}Write: ${diskio_write}
+-- [ SOVEREIGN PROCESSES ] ------------------------+${color0}
| ${color4}NAME${alignr}CPU %    RAM %${color0}
| ${top name 1} ${alignr}${color2}${top cpu 1}%   ${top mem 1}%${color0}
| ${top name 2} ${alignr}${color4}${top cpu 2}%   ${top mem 2}%${color0}
| ${top name 3} ${alignr}${color4}${top cpu 3}%   ${top mem 3}%${color0}
| ${top name 4} ${alignr}${color4}${top cpu 4}%   ${top mem 4}%${color0}
+-- [ STATUS: OPERATIONAL ] ------------------------+${color0}
]]

[project]
name = "workstation-hub"
version = "0.1.0"
description = "Autonomiczne centrum kontroli, audytu i zarządzania stacją roboczą oraz potokami multimedialnymi AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "transformers>=4.40.0,<5.0.0",
    "sentencepiece>=0.2.0",
    "sacremoses>=0.1.1",
    "faster-whisper>=1.0.0",
    "soundfile>=0.12.0",
    "edge-tts>=6.1.0",
    "av<14",
    "einops>=0.8.0",
    "qwen-tts>=0.1.1",
    "huggingface-hub>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.uv.workspace]
members = ["tools/kokoclone"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "tools"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tools", "assets", "templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]


